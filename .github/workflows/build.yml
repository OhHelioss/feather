name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly rebuild picks up a fresh blocklist

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Refresh blocklist (keeps the committed list if the download fails)
        run: |
          curl -fsSL https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt -o /tmp/hosts.txt || exit 0
          grep -E '^0\.0\.0\.0 ' /tmp/hosts.txt | awk '{print tolower($2)}' | grep -vE '^(0\.0\.0\.0|localhost)$' | sort -u > /tmp/blocklist.txt
          if [ "$(wc -l < /tmp/blocklist.txt)" -gt 10000 ]; then cp /tmp/blocklist.txt app/src/main/assets/blocklist.txt; fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Feather.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Feather-apk
          path: Feather.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Feather.apk --title "Feather (latest build)" \
            --notes "Signed sideload APK built from $GITHUB_SHA. Install it, or add this repo to Obtainium."
