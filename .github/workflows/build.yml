name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly rebuild picks up a fresh blocklist

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Refresh filter lists (keeps the committed ones if anything fails)
        run: |
          mkdir -p /tmp/l /tmp/out
          cp app/src/main/assets/blocklist.txt /tmp/out/
          RAW=https://raw.githubusercontent.com
          if curl -fsSL $RAW/easylist/easylist/gh-pages/easylist.txt -o /tmp/l/easylist.txt \
             && curl -fsSL $RAW/easylist/easylist/gh-pages/easyprivacy.txt -o /tmp/l/easyprivacy.txt \
             && curl -fsSL $RAW/uBlockOrigin/uAssets/master/filters/filters.txt -o /tmp/l/ubo.txt \
             && curl -fsSL $RAW/anudeepND/blacklist/master/adservers.txt -o /tmp/l/hosts.txt \
             && python3 tools/build_filters.py /tmp/out --hosts /tmp/l/hosts.txt /tmp/l/easylist.txt /tmp/l/easyprivacy.txt /tmp/l/ubo.txt; then
            if [ "$(wc -l < /tmp/out/blocklist.txt)" -gt 50000 ] && [ "$(wc -l < /tmp/out/net_rules.txt)" -gt 1000 ]; then
              cp /tmp/out/*.txt app/src/main/assets/
            fi
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Feather.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Feather-apk
          path: Feather.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Feather.apk --title "Feather (latest build)" \
            --notes "Signed sideload APK built from $GITHUB_SHA. Install it, or add this repo to Obtainium."
